name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.0 or 2.0.0-beta.1'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "$version is not a valid version (1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "The tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: >-
          for project in tests/*.Tests; do
          [ "$project" = tests/I18Next.Net.Wpf.Tests ] && continue;
          dotnet test "$project" -c Release || exit 1;
          done
      - name: Pack
        run: >-
          for project in src/*/*.csproj; do
          dotnet pack "$project" -c Release -o artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}
          -p:GeneratePackageOnBuild=false
          -p:ContinuousIntegrationBuild=true || exit 1;
          done
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/${{ steps.version.outputs.tag }}" -f sha="$GITHUB_SHA"
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${{ steps.version.outputs.tag }}" artifacts/packages/*.nupkg --verify-tag --generate-notes $prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
