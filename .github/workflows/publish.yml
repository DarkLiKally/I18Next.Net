name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag $GITHUB_REF_NAME is not a valid version (v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: >-
          for project in tests/I18Next.Net.Tests tests/I18Next.Net.Generators.Tests; do
          dotnet test "$project" -c Release || exit 1;
          done
      - name: Pack
        run: >-
          for project in src/*/*.csproj; do
          dotnet pack "$project" -c Release -o artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true || exit 1;
          done
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg --verify-tag --generate-notes $prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
