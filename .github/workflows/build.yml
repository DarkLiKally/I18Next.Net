name: build

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: '17 4 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - name: Build
        run: >-
          for project in src/*/*.csproj tests/*/*.csproj; do
          dotnet build "$project" -c Release -warnaserror:NU1901,NU1902,NU1903,NU1904 || exit 1;
          done
      - name: Vulnerability audit
        run: |
          failed=0
          for project in src/*/*.csproj tests/*/*.csproj; do
            output=$(dotnet list "$project" package --vulnerable --include-transitive 2>&1)
            echo "$output"
            if echo "$output" | grep -q "has the following vulnerable packages"; then
              failed=1
            fi
          done
          exit $failed
      - name: Test
        run: dotnet test tests/I18Next.Net.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Collect packages
        run: mkdir -p artifacts/packages && cp src/*/bin/Release/*.nupkg artifacts/packages/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
